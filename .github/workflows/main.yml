name: Flaky Detector Demo Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-test-report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Advance-Playwright-Framework-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clear npm cache and registry config
        run: |
          rm -f ~/.npmrc
          npm cache clean --force
          npm config delete registry || true
          npm config set registry https://registry.npmjs.org/
          npm config set strict-ssl false
          npm config get registry
          cat ~/.npmrc || echo "No ~/.npmrc file"

      - name: Install dependencies
        run: |
          npm ci --registry=https://registry.npmjs.org/ --strict-ssl=false

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        continue-on-error: true

      - name: Check JUnit file
        if: always()
        run: |
          pwd
          ls -la
          ls -la results || true
          test -f results/junit.xml || { echo "JUnit file missing"; exit 1; }

      - name: Send results to Flaky Test Detector
        if: always()
        run: |
          curl -X POST "${{ secrets.DETECTOR_URL }}/api/v1/test-runs/ingest-junit" \
            -H "X-API-Key: ${{ secrets.DETECTOR_API_KEY }}" \
            -F "file=@results/junit.xml" \
            -F "source_tool=playwright" \
            -F "commit_sha=${{ github.sha }}"
