name: Flaky Detector Demo Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-test-report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Advance-Playwright-Framework-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          mkdir -p results
          PLAYWRIGHT_JUNIT_OUTPUT_NAME=results/junit.xml npx playwright test --reporter=junit,list
        continue-on-error: true

      - name: Send results to Flaky Test Detector
        if: always()
        run: |
          if [ -f results/junit.xml ]; then
            echo "Ingesting results/junit.xml to Flaky Test Detector..."
            curl -v -X POST "${{ secrets.DETECTOR_URL }}/api/v1/test-runs/ingest-junit" \
              -H "X-API-Key: ${{ secrets.DETECTOR_API_KEY }}" \
              -F "file=@results/junit.xml" \
              -F "source_tool=playwright" \
              -F "commit_sha=${{ github.sha }}"
          else
            echo "Warning: results/junit.xml file not found. Skipping ingest."
          fi

