name: Flaky Detector Demo Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-test-report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Advance-Playwright-Framework-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          mkdir -p results
          npx playwright test
        continue-on-error: true
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: results/junit.xml

      - name: Send results to Flaky Test Detector
        if: always()
        env:
          DETECTOR_URL_SECRET: ${{ secrets.DETECTOR_URL }}
        run: |
          TARGET_URL="${DETECTOR_URL_SECRET:-https://flaky-test-detector-kbpc.onrender.com}"
          
          # Find junit.xml if in results or subfolder
          JUNIT_PATH="results/junit.xml"
          if [ ! -f "$JUNIT_PATH" ]; then
            FOUND_FILE=$(find . -name "junit.xml" | head -n 1)
            if [ -n "$FOUND_FILE" ]; then
              JUNIT_PATH="$FOUND_FILE"
            fi
          fi

          if [ -f "$JUNIT_PATH" ]; then
            echo "Ingesting ${JUNIT_PATH} to ${TARGET_URL}..."
            curl -v -X POST "${TARGET_URL}/api/v1/test-runs/ingest-junit" \
              -H "X-API-Key: ${{ secrets.DETECTOR_API_KEY }}" \
              -F "file=@${JUNIT_PATH}" \
              -F "source_tool=playwright" \
              -F "commit_sha=${{ github.sha }}"
          else
            echo "Warning: junit.xml file not found. Skipping ingest."
          fi


